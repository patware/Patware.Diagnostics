name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Let a main-branch run finish its deployment. Superseded PR and
  # feature-branch runs can still be cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: pwsh

jobs:
  packages:
    name: Libraries and packages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install DocFX
        run: |
          dotnet tool install --global docfx --version 2.81.0

          if ($LASTEXITCODE -ne 0) {
              throw 'DocFX installation failed.'
          }

      - name: Build, test, and pack
        id: build
        run: |
          $packages = ./Build.ps1
          "packages=$packages" >> $env:GITHUB_OUTPUT

      - name: Validate packages and consumer
        env:
          PACKAGE_DIRECTORY: ${{ steps.build.outputs.packages }}
        run: |
          ./eng/Test-Packages.ps1 `
            -PackageDirectory $env:PACKAGE_DIRECTORY `
            -ExpectedCommit $env:GITHUB_SHA

      - name: Retain validated packages
        uses: actions/upload-artifact@v7
        with:
          name: validated-packages-${{ github.sha }}
          path: ${{ steps.build.outputs.packages }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload documentation for GitHub Pages
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' ||
           github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site
          retention-days: 7

  documentation:
    name: Publish documentation
    needs: packages
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
